<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Name | Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body class="bg-slate-900 font-sans leading-relaxed text-slate-400 antialiased">
  <div id="glow" class="pointer-events-none fixed inset-0 z-30"></div>

  <div class="mx-auto max-w-screen-xl px-6 py-12 md:px-12 lg:px-24 lg:py-0">
    <div class="lg:flex lg:justify-between lg:gap-4">

      <header class="lg:sticky lg:top-0 lg:flex lg:max-h-screen lg:w-1/2 lg:flex-col lg:justify-between lg:py-24">
        <div>
          <h1 class="text-4xl font-bold tracking-tight text-slate-200 sm:text-5xl">Your Name</h1>
          <h2 class="mt-3 text-lg font-medium text-slate-200">CS Student at U of T</h2>
          <p class="mt-4 max-w-xs">One line about what you build.</p>

          <nav class="mt-16 hidden lg:block">
            <a href="#about" class="nav-link block py-2 text-xs font-semibold uppercase tracking-widest data-[active=true]:text-slate-200">About</a>
            <a href="#projects" class="nav-link block py-2 text-xs font-semibold uppercase tracking-widest data-[active=true]:text-slate-200">Projects</a>
            <a href="#contact" class="nav-link block py-2 text-xs font-semibold uppercase tracking-widest data-[active=true]:text-slate-200">Contact</a>
          </nav>
        </div>
        <div class="mt-8 flex gap-5 text-sm">
          <a href="https://github.com/you" class="hover:text-teal-300">GitHub</a>
          <a href="https://linkedin.com/in/you" class="hover:text-teal-300">LinkedIn</a>
        </div>
      </header>

      <main class="pt-24 lg:w-1/2 lg:py-24">
        <section id="about" class="mb-24 scroll-mt-24">
          <h2 class="mb-4 text-sm font-bold uppercase tracking-widest text-slate-200 lg:sr-only">About</h2>
          <p>Write 2 to 3 sentences about yourself here.</p>
        </section>

        <section id="projects" class="mb-24 scroll-mt-24">
          <h2 class="mb-4 text-sm font-bold uppercase tracking-widest text-slate-200 lg:sr-only">Projects</h2>
          <ul class="cards space-y-4">
            <li class="card rounded-lg p-4 transition hover:bg-slate-800/50">
              <h3 class="font-medium text-slate-200"><a href="https://github.com/you/project" class="hover:text-teal-300">Project Name</a></h3>
              <p class="mt-2 text-sm">Problem, what you built, result.</p>
              <ul class="mt-3 flex flex-wrap gap-2">
                <li class="rounded-full bg-teal-400/10 px-3 py-1 text-xs font-medium text-teal-300">Python</li>
                <li class="rounded-full bg-teal-400/10 px-3 py-1 text-xs font-medium text-teal-300">Flask</li>
              </ul>
            </li>
          </ul>
        </section>

        <section id="contact" class="scroll-mt-24">
          <h2 class="mb-4 text-sm font-bold uppercase tracking-widest text-slate-200 lg:sr-only">Contact</h2>
          <a href="mailto:you@email.com" class="hover:text-teal-300">you@email.com</a>
        </section>
      </main>

    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
